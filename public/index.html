<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Papan Status Tim</title>
<link rel="stylesheet" href="style.css">
<script>
(function () {
  var tema = localStorage.getItem('papan-status-tim:tema');
  if (tema !== 'dark' && tema !== 'light') {
    tema = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', tema);
})();
</script>
</head>
<body>

<header class="app-bar">
  <div class="app-bar-brand">
    <span class="logo-badge">
      <img src="https://cdn.prod.website-files.com/5eb6815b620703300b660930/61b33581789f2291a7c17425_Logo.svg" alt="MBCL" class="logo-mbcl">
    </span>
    <span class="app-bar-judul">Papan Status Tim</span>
  </div>

  <button id="tombol-tema" class="toggle-tema" type="button" role="switch" aria-checked="false" aria-label="Ganti mode terang/gelap">
    <span class="toggle-tema-thumb"></span>
    <span class="toggle-tema-label toggle-tema-label-light">☀ Light</span>
    <span class="toggle-tema-label toggle-tema-label-dark">☾ Dark</span>
  </button>
</header>

<main class="app-main">

<div id="pilih-nama" class="layar">
  <p class="subjudul">Pilih nama kamu untuk mulai</p>
  <div id="daftar-nama" class="daftar-tombol-nama"></div>
</div>

<div id="papan" class="layar" hidden>
  <header class="header-papan">
    <p class="info-masuk">
      Kamu: <strong id="nama-saya-label"></strong>
      · <button id="tombol-ganti-nama" class="tombol-tautan">ganti nama</button>
    </p>
    <a id="tombol-ekspor" class="tombol-ekspor" href="/api/export.csv" download>Export CSV</a>
  </header>

  <div id="daftar-kartu" class="daftar-kartu"></div>
</div>

</main>

<div id="editor-overlay" class="overlay" hidden>
  <div class="editor-kotak">
    <h2>Ubah Status Kamu</h2>

    <p class="label-editor">Status kerja</p>
    <div class="pilihan-status" id="pilihan-status">
      <button type="button" class="tombol-status" data-status="Belum Mulai">Belum Mulai</button>
      <button type="button" class="tombol-status" data-status="Dikerjakan">Dikerjakan</button>
      <button type="button" class="tombol-status" data-status="Selesai">Selesai</button>
    </div>

    <p class="label-editor">Tugas singkat</p>
    <input type="text" id="input-tugas" maxlength="60" placeholder="Contoh: Desain banner klien X">
    <p class="hitung-karakter"><span id="sisa-karakter">60</span> karakter tersisa</p>

    <p class="label-editor">Deskripsi (opsional)</p>
    <textarea id="input-deskripsi" maxlength="500" rows="4" placeholder="Detail tambahan tentang status ini..."></textarea>
    <p class="hitung-karakter"><span id="sisa-karakter-deskripsi">500</span> karakter tersisa</p>

    <p class="label-editor">Lampiran (opsional)</p>
    <div class="area-lampiran">
      <input type="file" id="input-file" hidden>
      <button type="button" id="tombol-pilih-file" class="tombol-sekunder">Pilih File</button>
      <p class="info-lampiran">
        <span id="nama-lampiran">Tidak ada lampiran</span>
        <a id="link-lampiran" href="#" target="_blank" rel="noopener" hidden>(lihat)</a>
      </p>
      <button type="button" id="tombol-hapus-lampiran" class="tombol-tautan" hidden>Hapus lampiran</button>
    </div>

    <p id="pesan-error" class="pesan-error" hidden></p>

    <div class="tombol-editor">
      <button id="tombol-simpan" class="tombol-utama">Simpan</button>
      <button id="tombol-batal" class="tombol-sekunder">Batal</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
